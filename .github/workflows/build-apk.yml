name: Build 去你的广告 B7.17

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # compileSdk 37; older project notes called this platforms;android-37.0.
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Validate source and rules
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py
          python3 tools/build_gkd_bundle.py --check
          python3 tools/prepare_gkd_selector.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fetch verified OCR model
        run: python3 tools/fetch_ocr_data.py

      - name: Build 去你的广告 B7.17
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gradle \
            :gkd-core:verifyGkdRuntime \
            :gkd-core:verifyAndroidHost \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee dist/ci-build.log

      - name: Run Release lint diagnostics
        if: steps.assemble.outcome == 'success'
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/report_lint.py --clean
          gradle :app:lintRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee dist/lint-release.log

      - name: Collect complete lint diagnostics
        if: always() && steps.assemble.outcome == 'success'
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          set -euo pipefail
          python3 tools/report_lint.py --outcome "$LINT_OUTCOME"
          cat dist/lint-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete lint reports
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-B7.17
          path: dist/lint-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Release lint result
        if: always() && steps.assemble.outcome == 'success'
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: python3 tools/report_lint.py --outcome "$LINT_OUTCOME" --check

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk dist/Qunideguanggao-B7.17.apk
          BYTES=$(stat -c%s dist/Qunideguanggao-B7.17.apk)
          [[ "$BYTES" -le 52428800 ]] || { echo 'APK exceeds 50 MiB' >&2; exit 1; }
          (cd dist && sha256sum Qunideguanggao-B7.17.apk > SHA256SUMS.txt)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Qunideguanggao-B7.17-APK
          path: |
            dist/Qunideguanggao-B7.17.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-B7.17
          path: dist/ci-build.log
          if-no-files-found: ignore
          retention-days: 7
