plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.adguardian.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'org.adguardian.app'
        minSdk = 30
        targetSdk = 37
        versionCode = 37
        versionName = '0.7.17-b7.17'
        ndk {
            abiFilters.addAll(['arm64-v8a', 'x86_64'])
        }
    }

    signingConfigs {
        development {
            storeFile = rootProject.file('dev-signing.jks')
            storePassword = 'adguardian-dev'
            keyAlias = 'adguardian-dev'
            keyPassword = 'adguardian-dev'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            signingConfig = signingConfigs.development
        }
        release {
            signingConfig = signingConfigs.development
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        showAll = true
        textReport = true
        textOutput = file("$buildDir/reports/lint-results-release.txt")
        xmlReport = true
        xmlOutput = file("$buildDir/reports/lint-results-release.xml")
        htmlReport = true
        htmlOutput = file("$buildDir/reports/lint-results-release.html")
    }
}

dependencies {
    implementation project(':gkd-core')
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.9.0'
}
